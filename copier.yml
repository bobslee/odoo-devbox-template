# Copier configuration for the Odoo Devbox template.
# Docs: https://copier.readthedocs.io/en/stable/configuring/
#
# Generate a project:
#   copier copy gh:<org>/odoo-devbox-template path/to/new-project
# Update an existing project to a newer template version:
#   cd path/to/new-project && copier update

# --- Template settings -------------------------------------------------------
_min_copier_version: "9.0.0"

# The project skeleton lives under src/; the repo root holds the template's own
# README, LICENSE and this config (none of which are copied into projects).
_subdirectory: src

# Files ending in .jinja are rendered (and the suffix stripped); everything else
# is copied verbatim.
_templates_suffix: .jinja

# Never copy these into generated projects.
_exclude:
  - "copier.yml"
  - "copier.yaml"
  - "~*"
  - "*.bak"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  # devbox.lock is shipped version-specific: src/devbox.lock.jinja is a tiny
  # dispatcher that {% include %}s the matching src/devbox.lock.<ver>.jinja
  # (real, self-contained locks), falling back to 19.0 for an unknown version.
  # The per-version partials must NOT be copied as standalone files — only the
  # dispatcher renders, to a single devbox.lock. (Jinja's loader still reads the
  # excluded partials from disk for the include.) Each version gets an instant
  # first `devbox install`; only python/postgresql differ across versions.
  # NB: _exclude matches the DESTINATION path (the .jinja suffix is already
  # stripped), hence "devbox.lock.*" — which matches devbox.lock.17.0 etc. but
  # not the dispatcher output "devbox.lock" (no trailing dot).
  - "devbox.lock.*"
  # src/README-preview.md is a pre-rendered preview of src/README.md.jinja
  # (committed only so the generated README is browsable on GitHub). No .jinja
  # renders to this name, so excluding it drops just the preview — the real
  # README.md (from README.md.jinja) is unaffected. Regenerate via
  # scripts/render-readme.sh.
  - "README-preview.md"

# Record answers in the generated project so `copier update` works.
_answers_file: .copier-answers.yml

_message_after_copy: |
  Your Odoo {{ odoo_version }} devbox project "{{ project_name }}" is ready.

  Next steps:
    1. cd into the project and `git init` (if not already a repo).
    2. Provide the Odoo source — see "First-time setup" in README.md.
    3. `devbox run setup` (creates the venv, installs Odoo + deps, init PostgreSQL).

# --- Questions ---------------------------------------------------------------
project_name:
  type: str
  help: Project name (README title, shell welcome banner).
  # Defaults to the destination directory name (i.e. the repo/project folder).
  default: "{{ _copier_conf.dst_path.name }}"

odoo_version:
  type: str
  help: Which Odoo version is this project targeting?
  choices:
    "17.0": "17.0"
    "18.0": "18.0"
    "19.0": "19.0"
    "20.0": "20.0"
  default: "19.0"

python_version:
  type: str
  help: Python version for devbox to pin (Odoo's supported range varies by version).
  choices:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"
  # Odoo 17 ships with/recommends 3.11; 18, 19 and 20 run on 3.12. All four
  # support 3.13 (opt-in; a few pins have no 3.13 wheel and build from source).
  # 3.14 is left out: Odoo 20's gevent/psycopg2 pins have no 3.14 wheels.
  default: "{% if odoo_version == '17.0' %}3.11{% else %}3.12{% endif %}"
  # Odoo 20 raised MIN_PY_VERSION to 3.12 (odoo/release.py): older interpreters
  # fail at import and its requirements.txt has no pins below 3.12.
  validator: >-
    {% if odoo_version == '20.0' and python_version in ['3.10', '3.11'] %}Odoo 20.0 requires Python 3.12 or newer.{% endif %}

postgresql_version:
  type: str
  help: PostgreSQL major version for devbox to pin.
  choices:
    - "14"
    - "15"
    - "16"
    - "17"
    - "18"
  # Odoo 20 defaults to PostgreSQL 18, 19 to 17; 16 is a safe default for 17/18.
  default: "{% if odoo_version == '20.0' %}18{% elif odoo_version == '19.0' %}17{% else %}16{% endif %}"
  # Odoo 20 raised MIN_PG_VERSION to 16 (odoo/release.py).
  validator: >-
    {% if odoo_version == '20.0' and postgresql_version in ['14', '15'] %}Odoo 20.0 requires PostgreSQL 16 or newer.{% endif %}

use_enterprise:
  type: bool
  help: Wire up an Odoo Enterprise symlink (requires private repo access)?
  default: true
